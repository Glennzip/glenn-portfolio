<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#181c35"/>
      <stop offset="100%" style="stop-color:#1e2240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#00d68f;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="200" fill="url(#accent)"/>
  <!-- Initials -->
  <text x="200" y="230" font-family="Inter, sans-serif" font-size="110" font-weight="800"
        fill="#9b8fff" text-anchor="middle" letter-spacing="-4">GB</text>
  <!-- Hint text -->
  <text x="200" y="310" font-family="Inter, sans-serif" font-size="16" font-weight="500"
        fill="#4a5568" text-anchor="middle">Replace with your photo</text>
  <text x="200" y="332" font-family="Inter, sans-serif" font-size="13"
        fill="#4a5568" text-anchor="middle">assets/images/profile.jpg</text>
</svg>
